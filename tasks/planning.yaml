tasks:
  - id: plan-antibiogram-export
    category: planning
    prompt: |
      A PHP/MySQL laboratory information system must add an "antibiogram export" feature: lab
      managers export, per period and ward, a cumulative antibiotic susceptibility report (percent
      S/I/R per organism x antibiotic, first isolate per patient, EUCAST or CLSI interpretation)
      as CSV and PDF. Produce an ordered implementation plan (max 400 words): steps, data model
      changes, validation of the epidemiology rules, rights/permissions, testing and rollout risks.
    rubric:
      - { id: first-isolate, description: "De-duplicates to first isolate per patient per period (CLSI M39 style), key epidemiology rule", points: 2, patterns: ['first[- ]isolate|de-?duplicat'] }
      - { id: interp, description: "Stores or recomputes interpretation with versioned breakpoints (EUCAST/CLSI year) for reproducibility", points: 2, patterns: ['breakpoint.{0,100}(version|year)|version.{0,60}breakpoint'] }
      - { id: privacy, description: "Access rights, anonymisation / data protection (GDPR) of exports", patterns: ['rights|permission|GDPR|anonymi[sz]'] }
      - { id: perf, description: "Performance on large result sets: indexing, async/queued generation, pagination or streaming", patterns: ['index|queue|async|stream|background job'] }
      - { id: tests, description: "Test strategy with known datasets / golden files", patterns: ['golden|fixture|known dataset|test data|unit test'] }
      - { id: order, description: "Plan is ordered with clear steps (numbered)", patterns: ['(^|\n)\s*(1[.)]|Step 1)'] }

  - id: plan-oru-interface
    category: planning
    prompt: |
      Plan the addition of a new inbound HL7 v2.5 ORU^R01 interface from a third-party analyser
      middleware into an existing LIS. Give an ordered plan (max 400 words) covering mapping,
      identifiers, error handling and ACKs, testing with sample messages, monitoring and cut-over.
    rubric:
      - { id: mapping, description: "Code mapping (local test codes to LOINC / internal codes) and unit handling", patterns: ['LOINC|code mapping|unit'] }
      - { id: ack, description: "ACK/NACK semantics (AA/AE/AR) and retries", patterns: ['\bAA\b|\bAE\b|\bAR\b|ACK'] }
      - { id: idem, description: "Idempotency on message control id; dead-letter or quarantine for failed messages", points: 2, patterns: ['idempot|duplicate|dead.letter|quarantine|MSH-10'] }
      - { id: patient-match, description: "Patient / order matching rules and handling of unmatched results", points: 2, patterns: ['match|unmatched|accession|placer|filler'] }
      - { id: monitor, description: "Monitoring/alerting and cut-over with parallel run or rollback", patterns: ['monitor|alert|rollback|parallel'] }
