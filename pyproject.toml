[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-model-bench"
version = "0.1.0"
description = "Personal benchmark comparing AI models via the Copilot CLI on speed, cost, quality and length, with a healthcare-software focus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
cmb = "bench.cli:main"

[tool.setuptools]
packages = ["bench"]
