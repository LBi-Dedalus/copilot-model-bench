# Copy to config.yaml (gitignored) and adjust.

# Command template used to call a model. {prompt} and {model} are substituted.
# Tools are NOT enabled, so the model cannot modify anything: context is inlined in the prompt.
command: ["copilot", "-p", "{prompt}", "--model", "{model}"]

# Seconds before a single call is aborted.
timeout_s: 600

# Runs per (model, task). Use 3+ to see variance.
runs: 3

# Models to compare, with premium-request multiplier (check your Copilot billing docs
# and keep this table up to date; these values are placeholders).
models:
  - { id: "claude-sonnet-5.5", multiplier: 1.0 }
  - { id: "gpt-6.1-sol", multiplier: 1.0 }
  - { id: "gemini-4-argon", multiplier: 1.0 }

# Judge model. Should be strong, and ideally not one of the contenders (self-preference bias).
judge:
  model: "claude-opus-5.5"
  multiplier: 1.0

# Root used to resolve `context_files` of tasks (e.g. a local checkout of a project).
# Never commit private code: keep private tasks in ./private (gitignored).
context_root: "C:/path/to/your/project"

# Optional: php binary used for code-writing tasks (hidden tests).
php: "php"

# Category weights for the composite score.
weights:
  comprehension: 1.0
  review: 1.0
  planning: 1.0
  code_writing: 1.0
  architecture: 1.0
  healthcare_jargon: 1.0
